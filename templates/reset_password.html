{% extends 'base.html' %}
{% block title %}Choose New Password - Share & Reuse{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="app-card shadow-sm border-0 rounded-4"><div class="app-card-body p-4 p-md-5">
    <h3 class="fw-bold mb-2">Choose a new password</h3>
    <p class="text-muted small">Use at least 8 characters.</p>
    <form method="POST">
      <label class="form-label small fw-semibold" for="password">New password</label>
      <input class="form-control mb-3" type="password" id="password" name="password" minlength="8" required autocomplete="new-password">
      <label class="form-label small fw-semibold" for="confirm_password">Confirm password</label>
      <input class="form-control mb-3" type="password" id="confirm_password" name="confirm_password" minlength="8" required autocomplete="new-password">
      <button class="btn btn-primary-custom w-100" type="submit">Save new password</button>
    </form>
  </div></div>
</div></div></div>
{% endblock %}
