{% extends 'base.html' %}

{% block title %}Sign In - Share & Reuse{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="app-card shadow-lg border-0 rounded-4">
        <div class="app-card-header bg-white text-center py-4 border-0">
          <div class="navbar-brand-badge mb-2">
            <i class="bi bi-recycle fs-4"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
          <p class="text-muted small mb-0">Sign in to manage your donations or distribution pickups</p>
        </div>

        <div class="app-card-body px-4 py-3">
          <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold text-secondary small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
              </div>
            </div>

            <div class="text-end mb-3 mt-n2">
              <a href="{{ url_for('forgot_password') }}" class="small text-success fw-semibold">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <!-- Quick Demo Logins for Examiner / Tester -->
          <div class="mt-4 pt-3 border-top">
            <div class="text-center mb-2">
              <span class="badge bg-light text-muted border px-2 py-1 small fw-semibold">Quick Demo Login (1-Click)</span>
            </div>
            
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('basaveshwar.hotel@gmail.com', 'donor123')">
                <span><i class="bi bi-building me-1"></i> <strong>Hotel Donor:</strong> Hotel Basaveshwar</span>
                <span class="badge bg-success-subtle text-success">donor123</span>
              </button>

              <button type="button" class="btn btn-sm btn-outline-info text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('snehadheepa.orphanage@gmail.com', 'org123')">
                <span><i class="bi bi-heart me-1"></i> <strong>NGO/Orphanage:</strong> Sneha Deepa</span>
                <span class="badge bg-info-subtle text-info">org123</span>
              </button>

              <button type="button" class="btn btn-sm btn-outline-purple text-start d-flex justify-content-between align-items-center" style="border-color: #c084fc; color: #7e22ce;" onclick="fillCredentials('greenweave.recycling@gmail.com', 'org123')">
                <span><i class="bi bi-recycle me-1"></i> <strong>Textile Recycler:</strong> GreenWeave</span>
                <span class="badge bg-light text-dark">org123</span>
              </button>

              <button type="button" class="btn btn-sm btn-outline-dark text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('admin@shareandreuse.org', 'admin123')">
                <span><i class="bi bi-shield-lock me-1"></i> <strong>Admin Console:</strong> Administrator</span>
                <span class="badge bg-dark text-white">admin123</span>
              </button>
            </div>
          </div>
        </div>

        <div class="app-card-header bg-light text-center py-3 border-top small text-muted">
          Don't have an account yet? <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Create an Account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
